name: Production Smoke

on:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Prepare SSH
        uses: ./.github/actions/prepare-production-ssh
        with:
          vps-host: ${{ secrets.DAILY_NAGGER_DEPLOY_HOST }}
          ssh-private-key: ${{ secrets.DAILY_NAGGER_DEPLOY_SSH_PRIVATE_KEY }}
          known-hosts: ${{ secrets.DAILY_NAGGER_DEPLOY_KNOWN_HOSTS }}

      - name: Run production smoke checks
        shell: pwsh
        run: .\scripts\smoke-production.ps1
