name: Mobile APK Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    environment: production

    env:
      EXPO_PUBLIC_DAILY_NAGGER_API_BASE_URL: ${{ vars.EXPO_PUBLIC_DAILY_NAGGER_API_BASE_URL }}
      EXPO_PUBLIC_DAILY_NAGGER_API_TOKEN: ${{ secrets.EXPO_PUBLIC_DAILY_NAGGER_API_TOKEN }}
      EXPO_PUBLIC_DAILY_NAGGER_COMMUNITY_ID: ${{ vars.EXPO_PUBLIC_DAILY_NAGGER_COMMUNITY_ID }}
      EXPO_PUBLIC_DAILY_NAGGER_USER_ID: ${{ vars.EXPO_PUBLIC_DAILY_NAGGER_USER_ID }}
      EXPO_PUBLIC_SENTRY_DSN: ${{ vars.EXPO_PUBLIC_SENTRY_DSN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: src/DailyNagger.Mobile/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Build APK artifact
        shell: pwsh
        run: .\scripts\build-mobile-ci-apk.ps1

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: dailynagger-apk-${{ github.sha }}
          path: artifacts/mobile-apk/*.apk
          retention-days: 1
          if-no-files-found: error
