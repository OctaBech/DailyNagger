name: Production Deploy

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Optional server image tag. Defaults to server-yyyyMMdd-HHmm."
        required: false
        type: string
      skip_migrations:
        description: "Skip EF migrations."
        required: true
        default: false
        type: boolean

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Prepare SSH
        uses: ./.github/actions/prepare-production-ssh
        with:
          vps-host: ${{ secrets.DAILY_NAGGER_DEPLOY_HOST }}
          ssh-private-key: ${{ secrets.DAILY_NAGGER_DEPLOY_SSH_PRIVATE_KEY }}
          known-hosts: ${{ secrets.DAILY_NAGGER_DEPLOY_KNOWN_HOSTS }}

      - name: Deploy production server
        shell: pwsh
        run: |
          $imageTag = "${{ inputs.image_tag }}"
          if ([string]::IsNullOrWhiteSpace($imageTag)) {
            $imageTag = "server-" + (Get-Date).ToUniversalTime().ToString("yyyyMMdd-HHmm")
          }
          $skipMigrations = [System.Convert]::ToBoolean("${{ inputs.skip_migrations }}")

          $backupRoot = Join-Path $env:RUNNER_TEMP "dailynagger-db-backups"
          .\scripts\deploy-production.ps1 `
            -LocalBackupRootPath $backupRoot `
            -ImageTag $imageTag `
            -SkipMigrations:$skipMigrations

          $backupPath = Get-ChildItem $backupRoot -Directory |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1

          if (!$backupPath) {
            throw "Deploy completed without a local database backup artifact."
          }

          "BACKUP_STAMP=$($backupPath.Name)" >> $env:GITHUB_ENV
          "BACKUP_PATH=$($backupPath.FullName)" >> $env:GITHUB_ENV

      - name: Upload deploy database backup artifact
        uses: actions/upload-artifact@v7
        with:
          name: production-deploy-db-backup-${{ env.BACKUP_STAMP }}
          path: ${{ env.BACKUP_PATH }}
          retention-days: 14
          if-no-files-found: error
