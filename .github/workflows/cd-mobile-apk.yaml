name: Build mobile APK

on:
  workflow_call:
    inputs:
      commit_sha:
        required: true
        type: string
      release_number:
        required: true
        type: string
      app_name:
        required: true
        type: string
      app_variant:
        required: true
        type: string
      android_package:
        required: true
        type: string
      community_id:
        required: true
        type: string
    secrets:
      ANDROID_SIGNING_KEYSTORE_BASE64:
        required: true
      ANDROID_SIGNING_PASSWORD:
        required: true
      DAILY_NAGGER_API_TOKEN:
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DAILY_NAGGER_MOBILE_RELEASE_NUMBER: ${{ inputs.release_number }}
      DAILY_NAGGER_MOBILE_APP_NAME: ${{ inputs.app_name }}
      EXPO_PUBLIC_DAILY_NAGGER_APP_VARIANT: ${{ inputs.app_variant }}
      DAILY_NAGGER_MOBILE_ANDROID_PACKAGE: ${{ inputs.android_package }}
      EXPO_PUBLIC_DAILY_NAGGER_COMMUNITY_ID: ${{ inputs.community_id }}
      EXPO_PUBLIC_DAILY_NAGGER_API_BASE_URL: ${{ vars.DAILY_NAGGER_API_BASE_URL }}
      EXPO_PUBLIC_DAILY_NAGGER_USER_ID: ${{ vars.DAILY_NAGGER_USER_ID }}
      EXPO_PUBLIC_DAILY_NAGGER_API_TOKEN: ${{ secrets.DAILY_NAGGER_API_TOKEN }}
      EXPO_PUBLIC_SENTRY_DSN: ${{ vars.SENTRY_DSN }}
    steps:
      - name: Checkout commit verified by CI
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.commit_sha }}
      - name: Set up Node.js and npm cache
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: src/DailyNagger.Mobile/package-lock.json

      - name: Install mobile dependencies
        working-directory: src/DailyNagger.Mobile
        run: npm ci
      - name: Set up Java for Android build
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle build cache
        uses: gradle/actions/setup-gradle@v6
      - name: Generate Android project from Expo configuration
        working-directory: src/DailyNagger.Mobile
        run: npx expo prebuild --platform android --clean --no-install
        env:
          DAILY_NAGGER_ANDROID_RELEASE_SIGNING: required
      - name: Restore release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_SIGNING_KEYSTORE_BASE64 }}
        run: |
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/dailynagger-release.p12"
          test -s "$RUNNER_TEMP/dailynagger-release.p12"
      - name: Verify release signing key
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_PASSWORD }}
        run: |
          keytool -list \
            -keystore "$RUNNER_TEMP/dailynagger-release.p12" \
            -storetype PKCS12 \
            -storepass:env KEYSTORE_PASSWORD \
            -alias dailynagger > /dev/null
      - name: Build signed release APK
        working-directory: src/DailyNagger.Mobile/android
        env:
          DAILY_NAGGER_ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/dailynagger-release.p12
          DAILY_NAGGER_ANDROID_SIGNING_PASSWORD: ${{ secrets.ANDROID_SIGNING_PASSWORD }}
          DAILY_NAGGER_ANDROID_KEY_ALIAS: dailynagger
        run: ./gradlew :app:assembleRelease --no-daemon
      - name: Verify built APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_PASSWORD }}
        run: |
          set -euo pipefail
          APK="src/DailyNagger.Mobile/android/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -type f -name apksigner | sort -V | tail -n 1)
          test -x "$APKSIGNER"
          "$APKSIGNER" verify "$APK"
          EXPECTED_CERT=$(keytool -exportcert \
            -keystore "$RUNNER_TEMP/dailynagger-release.p12" \
            -storetype PKCS12 \
            -storepass:env KEYSTORE_PASSWORD \
            -alias dailynagger | sha256sum | cut -d ' ' -f 1)
          ACTUAL_CERT=$("$APKSIGNER" verify --print-certs "$APK" | sed -n 's/.*certificate SHA-256 digest: //p' | head -n 1)
          test -n "$ACTUAL_CERT"
          if [ "$EXPECTED_CERT" != "$ACTUAL_CERT" ]; then
            echo "APK was not signed with the configured release key."
            exit 1
          fi
      - name: Save verified APK for release
        uses: actions/upload-artifact@v7
        with:
          name: dailynagger-${{ inputs.app_variant }}-${{ inputs.release_number }}
          path: src/DailyNagger.Mobile/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          compression-level: 0
