name: "CI 2 · Mobile"
run-name: "${{ github.workflow }} · ${{ github.event.head_commit.message || github.event.pull_request.title || github.sha }}"

on:
  workflow_call:

jobs:
  mobile:
    name: "CI 2 · Test mobile"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - name: Install mobile dependencies
        working-directory: src/DailyNagger.Mobile
        run: npm ci
      - name: Typecheck mobile
        working-directory: src/DailyNagger.Mobile
        run: npm run typecheck
      - name: Run Jest tests
        working-directory: src/DailyNagger.Mobile
        run: npm run test:ci
      - name: Run ESLint
        working-directory: src/DailyNagger.Mobile
        run: npm run lint
      - name: Check formatting
        working-directory: src/DailyNagger.Mobile
        run: npm run format:check

      - name: Verify encrypted personal APK packaging
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq 7zip
          work="$(mktemp -d)"
          trap 'rm -rf -- "$work"' EXIT
          printf 'CI-only test APK\n' > "$work/DailyNagger.apk"
          (
            cd "$work"
            7z a -tzip -mx=0 -mem=AES256 -pCI-only-password \
              DailyNaggerPersonal.zip DailyNagger.apk > /dev/null
          )
          7z t -pCI-only-password "$work/DailyNaggerPersonal.zip" > /dev/null
          if 7z t -pwrong-password "$work/DailyNaggerPersonal.zip" > /dev/null 2>&1; then
            echo 'Encrypted archive accepted the wrong password.' >&2
            exit 1
          fi
          7z l -slt "$work/DailyNaggerPersonal.zip" | grep -q 'Encrypted = +'
