name: "CI 2 · Server deployment"
run-name: "${{ github.workflow }} · ${{ github.event.head_commit.message || github.event.pull_request.title || github.sha }}"

on:
  workflow_call:

jobs:
  server-deployment-checks:
    name: "CI 2 · Check server deployment"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v7
      - name: Validate production Compose configuration
        run: |
          printf '%s\n' \
            'MSSQL_SA_PASSWORD=DailyNagger_Ci_12345' \
            'DAILY_NAGGER_SQL_APP_PASSWORD=DailyNagger_Ci_12345' \
            'DAILY_NAGGER_IMAGE_TAG=ci' \
            'DAILY_NAGGER_API_TOKEN=DailyNagger_CI_API_TOKEN' \
            'DAILY_NAGGER_PUBLIC_HOST=localhost' \
            > .env.ci
          docker compose --env-file .env.ci -f compose.prod.yaml config --quiet
      - name: Validate normal and maintenance Caddy configurations
        run: |
          for script in deploy/*.sh tests/deploy/*.sh; do
            bash -n "$script"
          done
          bash tests/deploy/caddy-mode.sh
          bash tests/deploy/production-db-backup-restore.sh
          bash deploy/prepare-caddy-state.sh "$PWD"
          cmp deploy/Caddyfile caddy-state/Caddyfile

          for mode in normal maintenance; do
            if [[ "$mode" == normal ]]; then
              template=deploy/Caddyfile
            else
              template=deploy/Caddyfile.maintenance
            fi
            cp "$template" caddy-state/Caddyfile
            docker run --rm --entrypoint caddy \
              -e DAILY_NAGGER_PUBLIC_HOST=localhost \
              -v "$PWD/caddy-state:/etc/caddy:ro" \
              caddy:2.10-alpine validate \
              --config /etc/caddy/Caddyfile --adapter caddyfile
          done

          # Initialisation must not accidentally reopen Caddy after a restart.
          bash deploy/prepare-caddy-state.sh "$PWD"
          cmp deploy/Caddyfile.maintenance caddy-state/Caddyfile
      - name: Exercise backup and restore on disposable SQL Server
        run: bash tests/deploy/production-db-backup-restore.integration.sh
      - name: Create server deployment archive (.tar.gz)
        run: |
          tar \
            --exclude=.git \
            --exclude=artifacts \
            --exclude='**/bin' \
            --exclude='**/obj' \
            --exclude='**/*.csproj.user' \
            --exclude='**/appsettings.Local.json' \
            --exclude=src/DailyNagger.Mobile/node_modules \
            --exclude=src/DailyNagger.Client/node_modules \
            -czf "$RUNNER_TEMP/dailynagger-source.tar.gz" \
            compose.prod.yaml \
            compose.staging.yaml \
            deploy \
            global.json \
            Directory.Build.props \
            src/DailyNagger.Server \
            scripts/run-vps-ef-migration.sh \
            scripts/run-vps-production-minimum-seed.sh \
            scripts/seed-production-minimum.sql
      - name: Extract server deployment archive
        run: |
          mkdir -p "$RUNNER_TEMP/dailynagger-unpacked"
          tar -xzf "$RUNNER_TEMP/dailynagger-source.tar.gz" \
            -C "$RUNNER_TEMP/dailynagger-unpacked"
      - name: Build Docker image from extracted deployment source
        run: |
          docker build \
            -f "$RUNNER_TEMP/dailynagger-unpacked/src/DailyNagger.Server/Dockerfile" \
            -t dailynagger-server:ci \
            "$RUNNER_TEMP/dailynagger-unpacked"
