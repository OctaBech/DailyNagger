name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

jobs:
  server:
    runs-on: ubuntu-latest

    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: DailyNagger_Ci_12345
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P DailyNagger_Ci_12345 -C -Q 'SELECT 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      ConnectionStrings__DailyNaggerData: Server=localhost,1433;Database=DailyNaggerData;User Id=sa;Password=DailyNagger_Ci_12345;Encrypt=True;TrustServerCertificate=True
      ConnectionStrings__DailyNaggerControl: Server=localhost,1433;Database=DailyNaggerControl;User Id=sa;Password=DailyNagger_Ci_12345;Encrypt=True;TrustServerCertificate=True
      DailyNaggerData__Password: DailyNagger_Ci_12345
      DailyNagger__ApiToken: ci-api-token

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore DailyNagger.sln

      - name: Check formatting
        run: dotnet format DailyNagger.sln --verify-no-changes --no-restore

      - name: Build
        run: dotnet build DailyNagger.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test DailyNagger.sln --configuration Release --no-build

  api-contracts:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: src/api-contracts/package-lock.json

      - name: Install dependencies
        working-directory: src/api-contracts
        run: npm ci

      - name: Typecheck
        run: npm run contracts:typecheck

      - name: Check formatting
        run: npm run contracts:format:check

      - name: Check generated contracts
        run: npm run contracts:check

  mobile:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: src/DailyNagger.Mobile/package-lock.json

      - name: Install dependencies
        working-directory: src/DailyNagger.Mobile
        run: npm ci

      - name: Typecheck
        working-directory: src/DailyNagger.Mobile
        run: npm run typecheck

      - name: Check formatting
        working-directory: src/DailyNagger.Mobile
        run: npm run format:check

  docker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate production compose
        run: |
          printf '%s\n' \
            'MSSQL_SA_PASSWORD=DailyNagger_Ci_12345' \
            'DAILY_NAGGER_SQL_APP_PASSWORD=DailyNagger_Ci_12345' \
            'DAILY_NAGGER_IMAGE_TAG=ci' \
            'DAILY_NAGGER_API_TOKEN=ci-api-token' \
            'DAILY_NAGGER_PUBLIC_HOST=localhost' \
            > .env.ci
          docker compose --env-file .env.ci -f compose.prod.yaml config --quiet

      - name: Pack server deploy source
        shell: pwsh
        run: |
          $archivePath = Join-Path $env:RUNNER_TEMP "dailynagger-source.tar.gz"
          .\scripts\pack-server-deploy-source.ps1 -OutputPath $archivePath

      - name: Build server image
        run: docker build -f src/DailyNagger.Server/Dockerfile -t dailynagger-server:ci .
