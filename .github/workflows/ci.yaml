name: "# CI"
run-name: "CI · ${{ github.event.pull_request.title || github.event.head_commit.message || github.sha }}"

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  changes:
    name: "CI 1 · Select checks and release plan"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      mobile: ${{ steps.filter.outputs.mobile }}
      server: ${{ steps.filter.outputs.server }}
      contracts: ${{ steps.filter.outputs.contracts }}
      deployment: ${{ steps.filter.outputs.deployment }}
      workflows: ${{ steps.filter.outputs.workflows }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            mobile:
              - "src/DailyNagger.Mobile/**"
              - "src/api-contracts/**"
              - ".node-version"
              - ".github/workflows/ci-mobile.yaml"
              - ".github/workflows/cd-mobile-apk.yaml"
              - ".github/workflows/cd.yaml"
              - ".github/workflows/ci.yaml"
            server:
              - "src/DailyNagger.Server/**"
              - "tests/DailyNagger.Server.Tests/**"
              - "src/api-contracts/**"
              - "DailyNagger.sln"
              - "Directory.Build.props"
              - "global.json"
              - ".github/workflows/ci-server.yaml"
              - ".github/workflows/cd-server-image.yaml"
              - ".github/workflows/cd.yaml"
              - ".github/workflows/ci.yaml"
            contracts:
              - "src/DailyNagger.Server/**"
              - "src/api-contracts/**"
              - "Directory.Build.props"
              - "global.json"
              - ".node-version"
              - ".github/workflows/ci-api-contracts.yaml"
              - ".github/workflows/ci.yaml"
            deployment:
              - "src/DailyNagger.Server/**"
              - "compose.prod.yaml"
              - "compose.staging.yaml"
              - "deploy/**"
              - "tests/deploy/**"
              - "global.json"
              - "Directory.Build.props"
              - ".dockerignore"
              - ".github/workflows/ci-server-deployment-checks.yaml"
              - ".github/workflows/cd-server-image.yaml"
              - ".github/workflows/cd.yaml"
              - ".github/workflows/cd-publish-server.yaml"
              - ".github/workflows/ci.yaml"
            workflows:
              - ".github/workflows/*.yaml"
              - ".github/workflows/*.yml"
      - name: Write release plan
        if: github.event_name == 'push'
        env:
          COMMIT_SHA: ${{ github.sha }}
          MOBILE_CHANGED: ${{ steps.filter.outputs.mobile }}
          SERVER_CHANGED: ${{ steps.filter.outputs.server }}
          CONTRACTS_CHANGED: ${{ steps.filter.outputs.contracts }}
        run: |
          printf 'commit_sha=%s\nmobile=%s\nserver=%s\ncontracts=%s\n' \
            "$COMMIT_SHA" "$MOBILE_CHANGED" "$SERVER_CHANGED" "$CONTRACTS_CHANGED" \
            > release-plan.txt

      - name: Save release plan for CD
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v7
        with:
          name: release-plan
          path: release-plan.txt
          if-no-files-found: error

  mobile:
    needs: changes
    if: ${{ github.event_name == 'workflow_dispatch' || needs.changes.outputs.mobile == 'true' }}
    uses: ./.github/workflows/ci-mobile.yaml
  server:
    needs: changes
    if: ${{ github.event_name == 'workflow_dispatch' || needs.changes.outputs.server == 'true' }}
    uses: ./.github/workflows/ci-server.yaml
  contracts:
    needs: changes
    if: ${{ github.event_name == 'workflow_dispatch' || needs.changes.outputs.contracts == 'true' }}
    uses: ./.github/workflows/ci-api-contracts.yaml
  deployment:
    needs: changes
    if: ${{ github.event_name == 'workflow_dispatch' || needs.changes.outputs.deployment == 'true' }}
    uses: ./.github/workflows/ci-server-deployment-checks.yaml
  workflow-lint:
    needs: changes
    if: ${{ github.event_name == 'workflow_dispatch' || needs.changes.outputs.workflows == 'true' }}
    uses: ./.github/workflows/ci-workflow-lint.yaml
  merge-gate:
    name: "CI 3 · Merge gate"
    needs: [changes, mobile, server, contracts, deployment, workflow-lint]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require every selected CI check to pass
        env:
          FORCE_ALL: ${{ github.event_name == 'workflow_dispatch' }}
          CHANGES_RESULT: ${{ needs.changes.result }}
          MOBILE_SELECTED: ${{ needs.changes.outputs.mobile }}
          MOBILE_RESULT: ${{ needs.mobile.result }}
          SERVER_SELECTED: ${{ needs.changes.outputs.server }}
          SERVER_RESULT: ${{ needs.server.result }}
          CONTRACTS_SELECTED: ${{ needs.changes.outputs.contracts }}
          CONTRACTS_RESULT: ${{ needs.contracts.result }}
          DEPLOYMENT_SELECTED: ${{ needs.changes.outputs.deployment }}
          DEPLOYMENT_RESULT: ${{ needs.deployment.result }}
          WORKFLOWS_SELECTED: ${{ needs.changes.outputs.workflows }}
          WORKFLOWS_RESULT: ${{ needs.workflow-lint.result }}
        run: |
          failed=0
          if [[ "$CHANGES_RESULT" != success ]]; then
            echo "Change selection did not pass: $CHANGES_RESULT"
            failed=1
          fi

          check() {
            local name="$1" selected="$2" result="$3"
            if [[ "$FORCE_ALL" == true || "$selected" == true ]]; then
              if [[ "$result" != success ]]; then
                echo "$name was required but did not pass: $result"
                failed=1
              fi
            elif [[ "$result" != skipped ]]; then
              echo "$name was not selected but finished unexpectedly: $result"
              failed=1
            fi
          }

          check mobile "$MOBILE_SELECTED" "$MOBILE_RESULT"
          check server "$SERVER_SELECTED" "$SERVER_RESULT"
          check contracts "$CONTRACTS_SELECTED" "$CONTRACTS_RESULT"
          check deployment "$DEPLOYMENT_SELECTED" "$DEPLOYMENT_RESULT"
          check workflows "$WORKFLOWS_SELECTED" "$WORKFLOWS_RESULT"
          exit "$failed"
