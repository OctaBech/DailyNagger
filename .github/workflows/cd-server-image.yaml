name: Build server image

on:
  workflow_call:
    inputs:
      commit_sha:
        required: true
        type: string
    outputs:
      image_digest:
        description: Digest of the published server image
        value: ${{ jobs.build.outputs.image_digest }}

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      image_digest: ${{ steps.image.outputs.digest }}
    steps:
      - name: Checkout commit verified by CI
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.commit_sha }}
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and publish server image
        id: image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./src/DailyNagger.Server/Dockerfile
          push: true
          tags: ghcr.io/octabech/dailynagger-server:${{ inputs.commit_sha }}
