name: dailynagger
services:
  seq:
    image: datalust/seq:latest
    container_name: dailynagger-seq
    environment:
      ACCEPT_EULA: "Y"
      SEQ_FIRSTRUN_NOAUTHENTICATION: "true"
    ports:
      - "5341:80"
    volumes:
      - seq-data:/data

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: dailynagger-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in .env}"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql

  sqlserver-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in .env}"
      DAILY_NAGGER_SQL_APP_PASSWORD: "${DAILY_NAGGER_SQL_APP_PASSWORD:?Set DAILY_NAGGER_SQL_APP_PASSWORD in .env}"
    depends_on:
      - sqlserver
    command: >
      /bin/bash -c "
      until /opt/mssql-tools18/bin/sqlcmd -S sqlserver -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -Q \"SELECT 1\"; do
        sleep 2;
      done;
      /opt/mssql-tools18/bin/sqlcmd -S sqlserver -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -Q \"IF DB_ID('DailyNaggerData') IS NULL CREATE DATABASE DailyNaggerData\";
      /opt/mssql-tools18/bin/sqlcmd -S sqlserver -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -Q \"IF DB_ID('DailyNaggerControl') IS NULL CREATE DATABASE DailyNaggerControl\";
      until /opt/mssql-tools18/bin/sqlcmd -S sqlserver -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -d DailyNaggerData -Q \"SELECT 1\"; do
        sleep 2;
      done;
      until /opt/mssql-tools18/bin/sqlcmd -S sqlserver -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -d DailyNaggerControl -Q \"SELECT 1\"; do
        sleep 2;
      done;
      /opt/mssql-tools18/bin/sqlcmd -S sqlserver -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -Q \"IF EXISTS (SELECT 1 FROM sys.sql_logins WHERE name = 'DailyNaggerApp') ALTER LOGIN DailyNaggerApp WITH PASSWORD = '$${DAILY_NAGGER_SQL_APP_PASSWORD}' ELSE CREATE LOGIN DailyNaggerApp WITH PASSWORD = '$${DAILY_NAGGER_SQL_APP_PASSWORD}'\";
      /opt/mssql-tools18/bin/sqlcmd -S sqlserver -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -d DailyNaggerData -Q \"IF NOT EXISTS (SELECT 1 FROM sys.database_principals WHERE name = 'DailyNaggerApp') CREATE USER DailyNaggerApp FOR LOGIN DailyNaggerApp; IF IS_ROLEMEMBER('db_datareader', 'DailyNaggerApp') = 0 ALTER ROLE db_datareader ADD MEMBER DailyNaggerApp; IF IS_ROLEMEMBER('db_datawriter', 'DailyNaggerApp') = 0 ALTER ROLE db_datawriter ADD MEMBER DailyNaggerApp\";
      /opt/mssql-tools18/bin/sqlcmd -S sqlserver -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -d DailyNaggerControl -Q \"IF NOT EXISTS (SELECT 1 FROM sys.database_principals WHERE name = 'DailyNaggerApp') CREATE USER DailyNaggerApp FOR LOGIN DailyNaggerApp; IF IS_ROLEMEMBER('db_datareader', 'DailyNaggerApp') = 0 ALTER ROLE db_datareader ADD MEMBER DailyNaggerApp; IF IS_ROLEMEMBER('db_datawriter', 'DailyNaggerApp') = 0 ALTER ROLE db_datawriter ADD MEMBER DailyNaggerApp\";
      "

  server:
    image: dailynagger-server:local
    build:
      context: .
      dockerfile: src/DailyNagger.Server/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      DOTNET_SYSTEM_NET_DISABLEIPV6: "1"
      DailyNagger__ApiToken: "${DAILY_NAGGER_API_TOKEN:?Set DAILY_NAGGER_API_TOKEN in .env}"
      ConnectionStrings__DailyNaggerData: "Server=sqlserver,1433;Database=DailyNaggerData;User Id=DailyNaggerApp;Password=${DAILY_NAGGER_SQL_APP_PASSWORD};Encrypt=True;TrustServerCertificate=True"
      ConnectionStrings__DailyNaggerControl: "Server=sqlserver,1433;Database=DailyNaggerControl;User Id=DailyNaggerApp;Password=${DAILY_NAGGER_SQL_APP_PASSWORD};Encrypt=True;TrustServerCertificate=True"
      DailyNaggerData__Password: "${DAILY_NAGGER_SQL_APP_PASSWORD:?Set DAILY_NAGGER_SQL_APP_PASSWORD in .env}"
      Serilog__WriteTo__1__Args__serverUrl: "http://seq"
    ports:
      - "5007:8080"
    depends_on:
      seq:
        condition: service_started
      sqlserver-init:
        condition: service_completed_successfully

volumes:
  seq-data:
  sqlserver-data:
